<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AppKits VS Code Editor</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="file-meta">
          <div id="file-name" class="file-name">/home/agent</div>
          <div id="file-path" class="file-path">Browse workspace files from the left tree.</div>
        </div>
        <div class="actions">
          <span id="status" class="status">Ready</span>
          <button id="refresh" type="button">Refresh</button>
          <button id="save" type="button" disabled>Save</button>
        </div>
      </header>
      <main class="workspace-shell">
        <aside class="sidebar">
          <div class="sidebar-title">Workspace</div>
          <div id="workspace-path" class="workspace-path">/home/agent</div>
          <nav id="file-tree" class="file-tree" aria-label="Workspace files"></nav>
        </aside>
        <section id="editor" class="editor"></section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
